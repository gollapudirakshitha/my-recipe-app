<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Recipe Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🍳 Interactive Recipe Finder</h1>

    <div class="controls">
      <input id="ingredients" placeholder="Enter ingredients, comma separated (e.g. tomato, onion)" />
      <button id="searchBtn">Search Recipes</button>
    </div>

    <div id="msg" class="msg"></div>
    <div id="recipes" class="recipes"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
